name: Dvh Analyzer CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'

    - name: Compile Python sources
      run: python -m compileall -q dvh_analyzer agents cli.py enrichment.py simulator.py

    - name: Check browser JavaScript
      run: |
        node --check web/dvh-core.js
        node --check web/app.js
        node --test web/dvh-core.test.cjs

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Check installed dependencies for known vulnerabilities
      if: matrix.python-version == '3.12'
      run: |
        python -m pip install pip-audit
        python -m pip_audit --skip-editable

    - name: HMAC integrity smoke test
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('HMAC integrity smoke test passed')
        "
